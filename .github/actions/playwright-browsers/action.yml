name: Cache Playwright browsers

description: Cache and install Playwright browser binaries for CI.

runs:
  using: composite

  steps:
    - name: Get installed Playwright version
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Playwright binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-webkit

    - name: Install Playwright browsers
      run: npx playwright install chromium webkit --with-deps
      shell: bash
