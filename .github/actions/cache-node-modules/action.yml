name: Cache node_modules

description: Cache node_modules and install npm dependencies when the cache misses.

inputs:
  node-version:
    description: Node.js version to use.
    required: false
    default: '24'

runs:
  using: composite

  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get Node.js version
      id: node-version
      run: echo "NODE_VERSION=$(node -v)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache node_modules
      id: cache-node_modules
      uses: actions/cache@v5
      with:
        path: '**/node_modules'
        key: node_modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.NODE_VERSION }}-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Install dependencies
      if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' }}
      run: npm ci
      shell: bash
